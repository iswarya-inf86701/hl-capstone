application:

  actions: actions

  web: web-src

  runtimeManifest:

    packages:

      hl-capstone:

        license: Apache-2.0

        actions:

          generic:
            function: actions/generic/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              final: true

          action1-inf86701:
            function: actions/action1-inf86701/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
              apiKey: $SERVICE_API_KEY
            annotations:
              require-adobe-auth: true
              final: true

          signup:
            function: actions/signup/index.js
            web: 'yes'
            runtime: nodejs:22
            inputs:
              LOG_LEVEL: debug
            annotations:
              require-adobe-auth: true
              include-ims-credentials: true
              final: true

    database:
      auto-provision: false
      region: apac